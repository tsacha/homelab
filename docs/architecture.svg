<text x='52' y='398' font-family='Menlo,Consolas,monospace' font-size='13' font-weight='700' fill='#1a1a1a'>apps  ·  ns: apps — deps: cluster-vars, infra</text>
<text x='52' y='420.5' font-family='Menlo,Consolas,monospace' font-size='10.5' fill='#5a5a5a'>Gateway/gw-public (edge TLS) + gw-private (WG-only VIP)</text>
<text x='52' y='437.0' font-family='Menlo,Consolas,monospace' font-size='10.5' fill='#5a5a5a'>lldap        LDAP directory, on gw-private only</text>
<text x='52' y='453.5' font-family='Menlo,Consolas,monospace' font-size='10.5' fill='#5a5a5a'>pocketid     OIDC provider, backed by lldap</text>
<text x='52' y='470.0' font-family='Menlo,Consolas,monospace' font-size='10.5' fill='#5a5a5a'>vaultwarden  Bitwarden-compatible password manager</text>
<text x='52' y='486.5' font-family='Menlo,Consolas,monospace' font-size='10.5' fill='#5a5a5a'>wg           WireGuard + reresolve sidecar (re-runs `wg set`</text>
<text x='52' y='503.0' font-family='Menlo,Consolas,monospace' font-size='10.5' fill='#5a5a5a'>             peer endpoint every 30s, works around bind</text>
<text x='52' y='519.5' font-family='Menlo,Consolas,monospace' font-size='10.5' fill='#5a5a5a'>             restarts breaking the tunnel's DNS)</text>
<rect x='492' y='378' width='268' height='153.5' rx='8' ry='8' fill='#fff6d9' stroke='#8a8a8a' stroke-width='1.2'/>
<text x='504' y='398' font-family='Menlo,Consolas,monospace' font-size='13' font-weight='700' fill='#1a1a1a'>dns  ·  HelmRelease — deps: apps</text>
<text x='504' y='420' font-family='Menlo,Consolas,monospace' font-size='10' fill='#5a5a5a'>bind9, dynamic zone from cluster-vars</text>
<text x='504' y='436' font-family='Menlo,Consolas,monospace' font-size='10' fill='#5a5a5a'>.dns.nodes / .dns.apps</text>
<text x='504' y='452' font-family='Menlo,Consolas,monospace' font-size='10' fill='#5a5a5a'>TCPRoute 53, UDPRoute 53,</text>
<text x='504' y='468' font-family='Menlo,Consolas,monospace' font-size='10' fill='#5a5a5a'>HTTPRoute (ACME http-01 :2136)</text>
<text x='504' y='484' font-family='Menlo,Consolas,monospace' font-size='10' fill='#5a5a5a'>SOA serial = {{ now }} → hourly</text>
<text x='504' y='500' font-family='Menlo,Consolas,monospace' font-size='10' fill='#5a5a5a'>restart via Reloader</text>
<rect x='800' y='453' width='720' height='65' rx='8' ry='8' fill='#fdeedb' stroke='#8a8a8a' stroke-width='1.2'/>
