<text x='1162' y='312' font-family='Menlo,Consolas,monospace' font-size='11' fill='#5a5a5a'>Cilium (BGP + IPPool), cert-manager, storageclass</text>
<text x='1162' y='329' font-family='Menlo,Consolas,monospace' font-size='11' fill='#5a5a5a'>(local-path + local-path-retain), volsync,</text>
<text x='1162' y='346' font-family='Menlo,Consolas,monospace' font-size='11' fill='#5a5a5a'>reloader, metrics-server</text>
