<text x='52' y='289' font-family='Menlo,Consolas,monospace' font-size='13' font-weight='700' fill='#1a1a1a'>cluster-vars</text>
<text x='52' y='312' font-family='Menlo,Consolas,monospace' font-size='11' fill='#5a5a5a'>Secret/cluster-secrets (sops)</text>
<text x='52' y='329' font-family='Menlo,Consolas,monospace' font-size='11' fill='#5a5a5a'>SECRET_DOMAIN, S3_*, RESTIC_PASSWORD,</text>
<text x='52' y='346' font-family='Menlo,Consolas,monospace' font-size='11' fill='#5a5a5a'>GW_PRIVATE_IP{V4,V6}</text>
