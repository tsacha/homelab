<text x='812' y='493' font-family='Menlo,Consolas,monospace' font-size='11' fill='#5a5a5a'>GatewayClasses cilium-gw-public/-private + Gateway/gw-private (all tenant routes)</text>
<text x='812' y='509' font-family='Menlo,Consolas,monospace' font-size='11' fill='#5a5a5a'>Gateway/gw-public (empty for now) + wildcard Certificate + http-redirect</text>
