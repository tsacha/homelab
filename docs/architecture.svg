<text x='780.0' y='30' font-family='Menlo,Consolas,monospace' font-size='19' font-weight='700' fill='#1a1a1a' text-anchor='middle'>homelab — GitOps architecture</text>
<text x='780.0' y='48' font-family='Menlo,Consolas,monospace' font-size='11.5' fill='#5a5a5a' text-anchor='middle'>Flux v2 · one directory per tenant (ks.yaml + kustomization.yaml + app/) · plain YAML + postBuild.substituteFrom, Helm kept only for dns</text>
