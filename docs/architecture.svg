<text x='402' y='312' font-family='Menlo,Consolas,monospace' font-size='11' fill='#5a5a5a'>Cilium (Gateway API), cert-manager + OVH webhook,</text>
<text x='402' y='329' font-family='Menlo,Consolas,monospace' font-size='11' fill='#5a5a5a'>GatewayClasses: public=nodeIPAM, private=wg-ippool,</text>
<text x='402' y='346' font-family='Menlo,Consolas,monospace' font-size='11' fill='#5a5a5a'>storageclass, volsync, reloader, metrics-server</text>
