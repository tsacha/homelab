---
- name: Backups unit
  ansible.builtin.template:
    src: backups.service
    dest: /etc/systemd/system/media.backups.service

- name: Backups timer
  ansible.builtin.template:
    src: backups.timer
    dest: /etc/systemd/system/media.backups.timer

- name: Start media backup timer
  ansible.builtin.systemd:
    state: started
    enabled: true
    name: media.backups.timer
