---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gw-apps.yaml
secretGenerator:
  - name: apps-values
    namespace: apps
    files:
      - values.yaml=values.sops.yaml
generatorOptions:
 disableNameSuffixHash: true
