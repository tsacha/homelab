apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden
  namespace: apps
spec:
  parentRefs:
    - name: gw-apps
      sectionName: vaultwarden-https
  hostnames:
    - "{{ .Values.pass.vaultwarden_vhost }}"
  rules:
    - backendRefs:
        - name: vaultwarden
          namespace: apps
          port: 80
