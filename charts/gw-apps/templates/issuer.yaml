apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
    name: letsencrypt-staging
spec:
    acme:
        email: {{ .Values.acme.issuer }}
        server: https://acme-staging-v02.api.letsencrypt.org/directory
        privateKeySecretRef:
            name: staging-issuer-account-key
        solvers:
            - http01:
                gatewayHTTPRoute:
                    parentRefs:
                        - name: gw-apps
                          kind: Gateway
                          sectionName: http
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
    name: letsencrypt
spec:
    acme:
        email: {{ .Values.acme.issuer }}
        server: https://acme-v02.api.letsencrypt.org/directory
        privateKeySecretRef:
            name: issuer-account-key
        solvers:
            - http01:
                gatewayHTTPRoute:
                    parentRefs:
                        - name: gw-apps
                          kind: Gateway
                          sectionName: http
