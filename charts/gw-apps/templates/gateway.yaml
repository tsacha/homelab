apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: gw-apps
spec:
  gatewayClassName: cilium
  listeners:
    - protocol: HTTP
      port: 80
      name: http
      allowedRoutes:
        namespaces:
          from: All
    - hostname: "{{ .Values.dns.http2136_vhost }}"
      name: gw-https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: http2136-cert
        mode: Terminate
    - hostname: "{{ .Values.pass.vaultwarden_vhost }}"
      name: vaultwarden-https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: vaultwarden-cert
        mode: Terminate
