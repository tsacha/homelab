apiVersion: v1
kind: Secret
metadata:
  name: restic-config-autobrr-config
  namespace: media
type: Opaque
stringData:
  RESTIC_REPOSITORY: s3:{{ .Values.backup.endpoint }}/{{ .Values.backup.bucket }}/autobrr-config
  RESTIC_PASSWORD: "{{ .Values.backup.restic }}"
  AWS_ACCESS_KEY_ID: "{{ .Values.backup.ak }}"
  AWS_SECRET_ACCESS_KEY: "{{ .Values.backup.sk }}"
---
