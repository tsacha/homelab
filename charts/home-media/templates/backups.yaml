---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: autobrr-config
  namespace: media
spec:
  sourcePVC: autobrr-config
  trigger:
    schedule: "0 * * * *"
  restic:
    repository: restic-config-autobrr-config
    copyMethod: Direct
    pruneIntervalDays: 14
    retain:
      hourly: 5
---
