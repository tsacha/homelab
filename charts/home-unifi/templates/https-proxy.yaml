## No support for HTTPS backend in Cilium GW (yet)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-http
  namespace: unifi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unifi-http
  template:
    metadata:
      labels:
        app: unifi-http
    spec:
      containers:
        - name: caddy
          image: docker.io/caddy:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy
              readOnly: true
      volumes:
        - name: caddy-config
          configMap:
            name: caddy-configmap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-configmap
data:
  Caddyfile: |
    :80 {
      reverse_proxy https://unifi-app:8443 {
        # UniFi 10.x rejects logins (403) when the Origin header does not
        # match the Host header; keep the client Host instead of the
        # upstream address rewritten by Caddy >= 2.11
        header_up Host {host}
        transport http {
          tls_insecure_skip_verify
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: unifi-http
  namespace: unifi
spec:
  selector:
    app: unifi-http
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
