apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vaultwarden
  name: vaultwarden
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      containers:
        - image: docker.io/vaultwarden/server:1.37.1
          name: vaultwarden
          imagePullPolicy: Always
          env:
            # v6-first cluster: Rocket's default 0.0.0.0 binds IPv4 only.
            - name: ROCKET_ADDRESS
              value: "::"
            - name: DOMAIN
              value: https://${VAULTWARDEN_VHOST}
            - name: SSO_ENABLED
              value: "true"
            - name: SSO_ONLY
              value: "false"
            - name: SSO_SIGNUPS_MATCH_EMAIL
              value: "true"
            - name: SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION
              value: "false"
            - name: SSO_AUTHORITY
              value: "https://${POCKETID_VHOST}"
            - name: SSO_SCOPES
              value: "email profile"
            - name: SSO_AUTHORIZE_EXTRA_PARAMS
              value: ""
            - name: SSO_PKCE
              value: "true"
            # $$ escapes the substitution: this is a regex meaning "empty", not a variable.
            - name: SSO_AUDIENCE_TRUSTED
              value: "^$$"
            - name: SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secrets
                  key: client-id
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secrets
                  key: client-secret
          volumeMounts:
            - name: vaultwarden-data
              mountPath: /data
      volumes:
        - name: vaultwarden-data
          persistentVolumeClaim:
            claimName: vaultwarden
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: vaultwarden
  name: vaultwarden
spec:
  selector:
    app: vaultwarden
  ports:
    - name: web
      protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden
spec:
  parentRefs:
    - name: gw-public
      sectionName: vaultwarden-https
  hostnames:
    - "${VAULTWARDEN_VHOST}"
  rules:
    - backendRefs:
        - name: vaultwarden
          namespace: apps
          port: 80
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vaultwarden
spec:
  secretName: vaultwarden-cert
  dnsNames:
    - "${VAULTWARDEN_VHOST}"
  issuerRef:
    name: le-prod
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: v1
kind: Secret
metadata:
  name: vaultwarden-secrets
type: Opaque
stringData:
  client-id: "${VAULTWARDEN_SSO_CLIENT_ID}"
  client-secret: "${VAULTWARDEN_SSO_CLIENT_SECRET}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: restic-config-vaultwarden
type: Opaque
stringData:
  RESTIC_REPOSITORY: s3:${S3_ENDPOINT}/${RESTIC_BUCKET_APPS}/vaultwarden
  RESTIC_PASSWORD: "${RESTIC_PASSWORD}"
  AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY}"
  AWS_SECRET_ACCESS_KEY: "${S3_SECRET_KEY}"
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: vaultwarden
spec:
  sourcePVC: vaultwarden
  trigger:
    schedule: "0 * * * *"
  restic:
    repository: restic-config-vaultwarden
    copyMethod: Direct
    pruneIntervalDays: 14
    retain:
      hourly: 6
      daily: 5
      weekly: 4
      monthly: 2
      yearly: 1
