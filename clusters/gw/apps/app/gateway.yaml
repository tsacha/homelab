apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-apps
spec:
  gatewayClassName: cilium
  listeners:
    - protocol: HTTP
      port: 80
      name: http
      allowedRoutes:
        namespaces:
          from: All
    # http2136-cert is issued by the dns tenant, which owns the bind workload.
    - hostname: "${DNS_HTTP2136_VHOST}"
      name: gw-https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: http2136-cert
        mode: Terminate
    - hostname: "${VAULTWARDEN_VHOST}"
      name: vaultwarden-https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: vaultwarden-cert
        mode: Terminate
    - hostname: "${POCKETID_VHOST}"
      name: pocketid-https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: pocketid-cert
        mode: Terminate
