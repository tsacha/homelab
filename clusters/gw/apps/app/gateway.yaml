apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-apps
spec:
  gatewayClassName: cilium-gw
  listeners:
    - protocol: HTTP
      port: 80
      name: http
      allowedRoutes:
        namespaces:
          from: All
    # http2136-cert is issued by the dns tenant, which owns the bind workload.
    - hostname: "${DNS_HTTP2136_VHOST}"
      name: http2136-https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: http2136-cert
        mode: Terminate
    - hostname: "${VAULTWARDEN_VHOST}"
      name: vaultwarden-https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: vaultwarden-cert
        mode: Terminate
    - hostname: "${POCKETID_VHOST}"
      name: pocketid-https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: pocketid-cert
        mode: Terminate
    - hostname: "${LLDAP_VHOST}"
      name: lldap-https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: lldap-cert
        mode: Terminate
    - hostname: "${LLDAP_VHOST}"
      name: lldap-tls
      port: 636
      protocol: TLS
      tls:
        mode: Passthrough
    - name: dns-tcp
      protocol: TCP
      port: 53
    - name: dns-udp
      protocol: UDP
      port: 53
---
# Cilium exposes all Gateway API listeners through the reserved ingress
# identity, so this policy describes access to the complete shared Gateway.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: gw-apps-ingress
spec:
  endpointSelector:
    matchExpressions:
      - key: reserved:ingress
        operator: Exists
  ingress:
    # Public listeners and HTTPS virtual hosts.
    - fromEntities:
        - world
        - cluster
        - host
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "636"
              protocol: TCP
            - port: "53"
              protocol: TCP
            - port: "53"
              protocol: UDP
        - ports:
            - port: "443"
              protocol: TCP
          rules:
            http:
              - host: "^${DNS_HTTP2136_VHOST}$"
              - host: "^${POCKETID_VHOST}$"
              - host: "^${VAULTWARDEN_VHOST}$"
    # LLDAP web UI is restricted to the configured IPv6 ranges.
    - fromCIDR: ${LLDAP_WEBUI_ALLOWED_CIDRS6}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          rules:
            http:
              - host: "^${LLDAP_VHOST}$"
