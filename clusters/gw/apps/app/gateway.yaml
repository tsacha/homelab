apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-public
spec:
  gatewayClassName: cilium-gw-public
  listeners:
    - protocol: HTTP
      port: 80
      name: http
      allowedRoutes:
        namespaces:
          from: All
    - hostname: "${VAULTWARDEN_VHOST}"
      name: vaultwarden-https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: vaultwarden-cert
        mode: Terminate
    - hostname: "${POCKETID_VHOST}"
      name: pocketid-https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: pocketid-cert
        mode: Terminate
    - name: dns-tcp
      protocol: TCP
      port: 53
    - name: dns-udp
      protocol: UDP
      port: 53
