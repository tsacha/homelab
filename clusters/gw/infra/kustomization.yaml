# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cilium.yaml
  - ippool.sops.yaml
  - cert-manager.yaml
  - velero.yaml
  - reloader.yaml
secretGenerator:
  - name: cilium-values
    namespace: kube-system
    files:
      - values.yaml=cilium-values.sops.yaml
  - name: velero-values
    namespace: velero
    files:
      - values.yaml=velero-values.sops.yaml
generatorOptions:
  disableNameSuffixHash: true
