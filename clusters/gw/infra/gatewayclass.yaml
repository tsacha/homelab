apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: gw
  namespace: kube-system
spec:
  service:
    ipFamilyPolicy: RequireDualStack
    ipFamilies:
      - IPv4
      - IPv6
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium-gw
spec:
  controllerName: io.cilium/gateway-controller
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: gw
    namespace: kube-system
