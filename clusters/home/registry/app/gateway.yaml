apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-registry
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: "${GW_REGISTRY_IP}"
  listeners:
    - protocol: HTTP
      name: http
      port: 80
      hostname: "*.${SECRET_DOMAIN}"
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.${SECRET_DOMAIN}"
      tls:
        certificateRefs:
          - kind: Secret
            name: wildcard-cert
