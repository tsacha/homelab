# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 5m0s
  url: https://helm.cilium.io/
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 5m0s
  chart:
    spec:
      chart: cilium
      reconcileStrategy: ChartVersion
      version: 1.20.1
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  # The addressing lives in cilium-values.sops.yaml. ⚠ Both files carry an
  # `ipam:` key: merge them recursively or `mode` below is lost.
  values:
    # KubePrism: at bootstrap there is no CoreDNS to resolve a name with.
    k8sServiceHost: localhost
    k8sServicePort: 7445
    ipv6:
      enabled: true
    ipv4:
      enabled: true
    kubeProxyReplacement: true
    ipam:
      mode: cluster-pool
    routingMode: native
    enableIPv4Masquerade: true
    enableIPv6Masquerade: false
    bpf:
      masquerade: true
    bgpControlPlane:
      enabled: true
    # Talos mounts cgroup2 read-only and grants only the capabilities listed here.
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - PERFMON
          - BPF
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    cgroup:
      hostRoot: /sys/fs/cgroup
      autoMount:
        enabled: false
    gatewayAPI:
      enabled: true
      enableAlpn: true
      enableAppProtocol: true
      gatewayClass:
        create: "false"
    operator:
      replicas: 1
    envoy:
      enabled: true
    hubble:
      enabled: false
  valuesFrom:
    - kind: Secret
      name: cilium-values
