# k3s shipped this built in; Talos does not, so every PVC would stay Pending.
#
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/gitrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: local-path-provisioner
  namespace: flux-system
spec:
  interval: 10m
  url: https://github.com/rancher/local-path-provisioner
  ref:
    tag: v0.0.37
  ignore: |
    /*
    !/deploy/chart/local-path-provisioner
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: kube-system
spec:
  interval: 5m0s
  chart:
    spec:
      chart: ./deploy/chart/local-path-provisioner
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: local-path-provisioner
        namespace: flux-system
  values:
    # One provisioner, two classes: `local-path` (Delete) here, `local-path-retain`
    # (Retain) in storageclass.yaml. Do not rename either.
    storageClass:
      create: true
      name: local-path
      provisionerName: rancher.io/local-path
      defaultClass: true
      reclaimPolicy: Delete
      volumeBindingMode: WaitForFirstConsumer

    # Chart default is /opt, which is read-only on Talos. Only /var is writable.
    nodePathMap:
      - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
        paths:
          - /var/local-path-provisioner
