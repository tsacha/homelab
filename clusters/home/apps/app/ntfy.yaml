apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  name: ntfy
  labels:
    app: ntfy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      containers:
        - name: ntfy
          image: docker.io/binwiederhier/ntfy:v2.26.3
          args:
            - serve
          env:
            - name: NTFY_WEB_PUSH_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: ntfy-webpush
                  key: public-key
            - name: NTFY_WEB_PUSH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: ntfy-webpush
                  key: private-key
          ports:
            - name: http
              containerPort: 80
          startupProbe:
            httpGet:
              path: /v1/health
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/ntfy/server.yml
              subPath: server.yml
              readOnly: true
            - name: data
              mountPath: /var/lib/ntfy
      volumes:
        - name: config
          configMap:
            name: ntfy-config
        - name: data
          persistentVolumeClaim:
            claimName: ntfy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
data:
  topic: monitoring
  server.yml: |
    base-url: "https://ntfy.${SECRET_DOMAIN}"
    listen-http: ":80"
    behind-proxy: true
    cache-file: "/var/lib/ntfy/cache.db"
    cache-duration: "168h"
    web-push-file: "/var/lib/ntfy/webpush.db"
    web-push-email-address: "sacha@${SECRET_DOMAIN}"
---
apiVersion: v1
kind: Secret
metadata:
  name: ntfy-webpush
type: Opaque
stringData:
  public-key: "${NTFY_WEB_PUSH_PUBLIC_KEY}"
  private-key: "${NTFY_WEB_PUSH_PRIVATE_KEY}"
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  labels:
    app: ntfy
spec:
  selector:
    app: ntfy
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ntfy
spec:
  parentRefs:
    - name: gw-private
      namespace: gateway
      sectionName: https
  hostnames:
    - ntfy.${SECRET_DOMAIN}
  rules:
    - backendRefs:
        - name: ntfy
          port: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: restic-config-ntfy
type: Opaque
stringData:
  RESTIC_REPOSITORY: s3:${S3_ENDPOINT}/${RESTIC_BUCKET_APPS}/ntfy
  RESTIC_PASSWORD: "${RESTIC_PASSWORD}"
  AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY}"
  AWS_SECRET_ACCESS_KEY: "${S3_SECRET_KEY}"
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: ntfy
spec:
  sourcePVC: ntfy
  trigger:
    schedule: "0 * * * *"
  restic:
    repository: restic-config-ntfy
    copyMethod: Direct
    pruneIntervalDays: 14
    retain:
      hourly: 6
      daily: 5
      weekly: 4
      monthly: 2
      yearly: 1
