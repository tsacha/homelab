apiVersion: apps/v1
kind: Deployment
metadata:
  name: papra
  labels:
    app: papra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: papra
  template:
    metadata:
      labels:
        app: papra
    spec:
      containers:
        - name: papra
          image: ghcr.io/papra-hq/papra:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 1221
          volumeMounts:
            - name: papra-docs
              mountPath: /app/app-data
          env:
            - name: APP_BASE_URL
              value: https://docs.${SECRET_DOMAIN}
            - name: DOCUMENT_STORAGE_MAX_UPLOAD_SIZE
              value: "0"
            - name: DOCUMENTS_OCR_LANGUAGES
              value: "fra"
            - name: SERVER_HOSTNAME
              value: "::"
            - name: AUTH_PROVIDERS_EMAIL_IS_ENABLED
              value: "false"
            - name: AUTH_SECRET
              value: "${PAPRA_AUTH_SECRET}"
            # Key order is alphabetical because Helm's toJson sorted the map it
            # replaced; keeping it makes the render diff against the old chart empty.
            - name: AUTH_PROVIDERS_CUSTOMS
              value: '[{"clientId":"${PAPRA_OAUTH_CLIENT_ID}","clientSecret":"${PAPRA_OAUTH_CLIENT_SECRET}","discoveryUrl":"${PAPRA_OAUTH_URL}","pkce":true,"providerIconUrl":"https://api.iconify.design/tabler:login-2.svg","providerId":"${PAPRA_OAUTH_ID}","providerName":"${PAPRA_OAUTH_NAME}","scopes":["openid","profile","email"],"type":"oidc"}]'
      volumes:
        - name: papra-docs
          persistentVolumeClaim:
            claimName: papra-docs
