apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: papra-docs
  annotations:
    # Must stay until the old Helm release is gone: helm uninstall would
    # otherwise delete the volume out from under the new manifests.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
