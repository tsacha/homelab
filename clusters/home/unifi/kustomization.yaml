---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - home-unifi.yaml
secretGenerator:
  - name: unifi-values
    namespace: unifi
    files:
      - values.yaml=values.sops.yaml
generatorOptions:
  disableNameSuffixHash: true
