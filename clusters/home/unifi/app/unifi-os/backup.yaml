apiVersion: v1
kind: Secret
metadata:
  name: restic-config-unifi-os-pvc
type: Opaque
stringData:
  RESTIC_REPOSITORY: s3:${S3_ENDPOINT}/${RESTIC_BUCKET_UNIFI}/unifi-os-pvc
  RESTIC_PASSWORD: "${RESTIC_PASSWORD}"
  AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY}"
  AWS_SECRET_ACCESS_KEY: "${S3_SECRET_KEY}"
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: unifi-os-pvc
spec:
  sourcePVC: unifi-os-pvc
  trigger:
    schedule: "0 * * * *"
  restic:
    repository: restic-config-unifi-os-pvc
    copyMethod: Direct
    pruneIntervalDays: 14
    retain:
      hourly: 6
      daily: 5
      weekly: 4
      monthly: 2
      yearly: 1
