apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-os-server
  labels:
    app: unifi-os-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unifi-os-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: unifi-os-server
    spec:
      hostname: unifi-os
      containers:
        - name: unifi-os-server
          image: ghcr.io/lemker/unifi-os-server:v1.4.0
          securityContext:
            privileged: true
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: UOS_SYSTEM_IP
              value: "${UNIFI_SYSTEM_IP}"
          lifecycle:
            postStart:
              exec:
                # $$ escapes the substitution: Flux replaces ${...} across the
                # whole rendered output, and $HOST_IP must survive to the shell.
                command: ["/bin/bash", "-c", "echo $$HOST_IP host.docker.internal >> /etc/hosts"]
          volumeMounts:
            - name: data
              mountPath: /persistent
              subPath: persistent
            - name: data
              mountPath: /var/log
              subPath: log
            - name: data
              mountPath: /data
              subPath: data
            - name: data
              mountPath: /srv
              subPath: srv
            - name: data
              mountPath: /var/lib/unifi
              subPath: unifi
            - name: data
              mountPath: /var/lib/mongodb
              subPath: mongodb
            - name: data
              mountPath: /etc/rabbitmq/ssl
              subPath: rabbitmq
          livenessProbe:
            httpGet:
              path: /api/ping
              port: 80
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: unifi-os-pvc
