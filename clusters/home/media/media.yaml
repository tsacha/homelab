apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    pod-security.kubernetes.io/enforce: privileged
  annotations:
    volsync.backube/privileged-movers: "true"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: media
  namespace: media
spec:
  interval: 5m0s
  chart:
    spec:
      chart: ./charts/home-media
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: media-values
  # Scaffolding for the move off Helm: makes `helm uninstall` a no-op so the
  # plain-YAML manifests adopt the live objects instead of racing their deletion.
  # Must reconcile before the HelmRelease is removed. Delete along with it.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: .*
            patch: |
              apiVersion: v1
              kind: placeholder
              metadata:
                name: placeholder
                annotations:
                  helm.sh/resource-policy: keep
