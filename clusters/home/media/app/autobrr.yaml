apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: autobrr
  name: autobrr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: autobrr
  template:
    metadata:
      labels:
        app: autobrr
    spec:
      containers:
        - image: ghcr.io/autobrr/autobrr:v1.85.0
          env:
            - name: PUID
              value: "0"
            - name: PGID
              value: "0"
          name: autobrr
          volumeMounts:
            - name: autobrr-config
              mountPath: /config
      volumes:
        - name: autobrr-config
          persistentVolumeClaim:
            claimName: autobrr-config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: autobrr
  name: autobrr
spec:
  selector:
    app: autobrr
  ports:
    - name: web
      protocol: TCP
      port: 80
      targetPort: 7474
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: autobrr
spec:
  parentRefs:
    - name: gw-private
      namespace: gateway
      sectionName: https
  hostnames:
    - autobrr.${SECRET_DOMAIN}
  rules:
    - backendRefs:
        - name: autobrr
          port: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autobrr-config
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: restic-config-autobrr-config
type: Opaque
stringData:
  RESTIC_REPOSITORY: s3:${S3_ENDPOINT}/${RESTIC_BUCKET_MEDIA}/autobrr-config
  RESTIC_PASSWORD: "${RESTIC_PASSWORD}"
  AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY}"
  AWS_SECRET_ACCESS_KEY: "${S3_SECRET_KEY}"
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: autobrr-config
spec:
  sourcePVC: autobrr-config
  trigger:
    schedule: "0 * * * *"
  restic:
    repository: restic-config-autobrr-config
    copyMethod: Direct
    pruneIntervalDays: 14
    retain:
      hourly: 6
      daily: 5
      weekly: 4
      monthly: 2
      yearly: 1
