# One age key for everything. First matching rule wins.
creation_rules:
  # Flux cluster-secrets: keep metadata readable so kustomize can patch it.
  - path_regex: cluster-secrets\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: age164zdqnr4yzgxjyxp8mlxkn9z5nanl9u4p7s95x95spkjl2x85gqqfl8r00

  # No encrypted_regex: whole-file is the only mode that encrypts comments too.
  - path_regex: \.sops\.(ya?ml|rsc)$
    age: age164zdqnr4yzgxjyxp8mlxkn9z5nanl9u4p7s95x95spkjl2x85gqqfl8r00
