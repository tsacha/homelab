# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"
tasks:
  check:
    desc: "Nothing identifying sits in an unencrypted file (needs the age key)"
    cmds:
      - bash tasks/secrets.sh
  hook:
    desc: "Install the pre-commit hook — once per clone, shared by every worktree"
    cmds:
      - git config core.hooksPath .githooks
      - echo "core.hooksPath = .githooks"
  inventory:
    desc: "Decrypt the inventory to .private/inventory.yaml"
    cmds:
      - mkdir -p .private
      - sops -d secrets/inventory.sops.yaml > .private/inventory.yaml
