# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"
tasks:
  cluster:
    internal: true
    preconditions:
      - sh: test "{{.CLUSTER}}" = home || test "{{.CLUSTER}}" = gw
        msg: "bootstrap: CLUSTER must be home or gw"
  flux:
    desc: "Bootstrap Flux (CLUSTER=home|gw)"
    deps: [cluster]
    cmds:
      - |
        set -euo pipefail
        kube=$(yq -r '.{{if eq .CLUSTER "gw"}}gw{{else}}network{{end}}.fqdn|sub("\\.";"-")' .private/inventory.yaml)
        export KUBECONFIG=~/.kube/clusters/$kube.yaml
        kubectl get ns flux-system || kubectl create ns flux-system
        kubectl -n flux-system get secrets forgejo-auth || kubectl -n flux-system create secret generic forgejo-auth \
          --from-literal=username="$(yq -r '.flux.forgejo_user' .private/inventory.yaml)" \
          --from-literal=password="$(yq -r '.flux.forgejo_pat' .private/inventory.yaml)"
        kubectl -n flux-system get secrets sops-age || kubectl -n flux-system create secret generic sops-age \
          --from-file=age.agekey="$HOME/.config/sops/age/keys.txt"
        kubectl apply --server-side -f clusters/{{.CLUSTER}}/flux-system/gotk-components.yaml
        kubectl apply --server-side -k clusters/{{.CLUSTER}}/flux-system
  cni:
    desc: "Install Cilium with Gateway API CRDs (CLUSTER=home|gw)"
    deps: [cluster]
    cmds:
      - |
        set -euo pipefail
        kube=$(yq -r '.{{if eq .CLUSTER "gw"}}gw{{else}}network{{end}}.fqdn|sub("\\.";"-")' .private/inventory.yaml)
        export KUBECONFIG=~/.kube/clusters/$kube.yaml
        export CILIUM_VERSION=1.20.1 # renovate: datasource=github-releases depName=cilium packageName=cilium/cilium
        export GATEWAY_API_VERSION=v1.6.1 # renovate: datasource=github-releases depName=gateway-api packageName=kubernetes-sigs/gateway-api
        kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/$GATEWAY_API_VERSION/experimental-install.yaml
        helm repo add cilium https://helm.cilium.io/
        bash tasks/cilium-values.sh {{.CLUSTER}} \
          | helm upgrade --install cilium cilium/cilium -n kube-system --version=$CILIUM_VERSION -f -
