# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"
tasks:
  kvm:
    desc: Start a debug VM with cloud-init
    dir: debug
    cmds:
      - |
        if [ ! -f upstream.img ]; then
          wget https://cloud-images.ubuntu.com/plucky/current/plucky-server-cloudimg-amd64.img -O upstream.img
        fi

        cp -f upstream.img current.img
        qemu-img resize current.img 20G

        cp ../private/debug/cloud-init/user-data.yaml user-data
        cp ../private/debug/cloud-init/meta-data.yaml meta-data
        cp ../private/debug/cloud-init/network-config-eth.yaml network-config
        genisoimage -output seed.iso -V cidata -r -J ./user-data  ./meta-data ./network-config
        rm -f user-data meta-data network-config

        qemu-system-x86_64  \
          -machine accel=kvm \
          -bios /usr/share/ovmf/x64/OVMF.4m.fd \
          -cpu host \
          -m 2G \
          -boot order=d \
          -nographic \
          -netdev bridge,id=net0,br=br \
          -device virtio-net-pci,netdev=net0,id=nic1 \
          -drive if=virtio,format=qcow2,file=current.img \
          -drive file=seed.iso,format=raw,if=virtio
