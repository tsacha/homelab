# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"
vars:
  CLUSTER:
    sh: yq -r '.network.fqdn|sub("\\.";"-")' .private/inventory.yaml || /bin/true
  FORGEJO_USER:
    sh: yq -r '.flux.forgejo_user' .private/inventory.yaml || /bin/true
  FORGEJO_PAT:
    sh: yq -r '.flux.forgejo_pat' .private/inventory.yaml || /bin/true
tasks:
  flux:
    cmds:
      - |
        export KUBECONFIG=~/.kube/{{.CLUSTER}}.yaml
        export GITEA_TOKEN={{.FORGEJO_PAT}}
        kubectl get ns flux-system || kubectl create ns flux-system
        kubectl -n flux-system get secrets forgejo-auth || kubectl -n flux-system create secret generic forgejo-auth \
          --from-literal=username={{.FORGEJO_USER}} \
          --from-literal=password={{.FORGEJO_PAT}}

        kubectl -n flux-system get secrets sops-age || cat ~/.config/sops/age/keys.txt | kubectl create secret generic sops-age \
          --namespace=flux-system \
          --from-file=age.agekey=/dev/stdin

        flux install
        pushd clusters/home/flux-system
        kubectl apply --server-side -k .
        popd
