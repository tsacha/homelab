# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  KUBECONFIG: '{{ default "~/.kube/{{.cluster}}" .KUBECONFIG }}'
env:
  KUBECONFIG: '~/.kube/{{.cluster}}.yaml'

tasks:
  init:
    dir: .decrypted
    desc: "Initialize Talos cluster secrets and tokens"
    prompt: This is a dangerous command... Do you want to continue?
    cmds:
      - mkdir -p talos
      - gomplate -d inventory=inventory.yaml -f ../templates/talos/patch.all.tmpl > talos/patch.all.yaml
      - gomplate -d inventory=inventory.yaml -f ../templates/talos/patch.cp.tmpl > talos/patch.cp.yaml
      - talosctl gen --force secrets -o talos/secrets.yaml
      - |
        talosctl gen config -t talosconfig  --force \
          --with-secrets talos/secrets.yaml \
          {{ .cluster }} \
          https://{{ .endpoint }}:6443 \
          --config-patch @talos/patch.all.yaml \
          --config-patch-control-plane=@talos/patch.cp.yaml \
          --output-dir talos
      - mv talos/talosconfig talos/talosconfig.yaml
      - chmod 600 talos/secrets.yaml talos/talosconfig.yaml

  gen:
    dir: .decrypted
    desc: "Generate full Talos cluster configuration"
    cmds:
      - mkdir -p talos/nodes
      - gomplate -d inventory=inventory.yaml -f ../templates/talos/patch.all.tmpl > talos/patch.all.yaml
      - gomplate -d inventory=inventory.yaml -f ../templates/talos/patch.cp.tmpl > talos/patch.cp.yaml
      - |
        talosctl gen config -t controlplane,worker --force \
          --with-secrets talos/secrets.yaml \
          {{ .cluster }} \
          https://{{ .endpoint }}:6443 \
          --config-patch @talos/patch.all.yaml \
          --config-patch-control-plane=@talos/patch.cp.yaml \
          --output-dir talos
      - for: { var: nodes }
        task: genmachine
        vars:
          node: '{{ .ITEM }}'

  genmachine:
    dir: .decrypted
    desc: "Generate per-node machine configs and PXE boot files"
    vars:
      mac:
        sh: yq -r ".nodes.{{ .node }}.mac" inventory.yaml | sed "s/:/-/g"
    cmds:
      - NODE={{.node}} gomplate -d inventory=inventory.yaml -f ../templates/talos/patch.node.tmpl > talos/nodes/patch.node.{{.node}}.yaml
      - talosctl machineconfig patch talos/controlplane.yaml --patch @talos/nodes/patch.node.{{.node}}.yaml --output talos/nodes/{{.node}}.yaml
      - NODE={{.node}} gomplate -d inventory=inventory.yaml -f ../templates/boot/node.ipxe > talos/nodes/{{.mac}}.ipxe
      - rsync --rsync-path "sudo rsync" talos/nodes/{{.node}}.yaml boot.{{.fqdn}}:/srv/tftp/nodes/
      - rsync --rsync-path "sudo rsync" talos/nodes/{{.mac}}.ipxe boot.{{.fqdn}}:/srv/tftp/nodes/
    internal: true

  local:
      dir: .decrypted
      desc: Setup talosctl and kubectl on local machine
      cmds:
      - cp talos/talosconfig.yaml ../.talosconfig
      - talosctl --talosconfig ../.talosconfig config endpoint kube.{{.fqdn}}
      - talosctl --talosconfig ../.talosconfig config nodes kube.{{.fqdn}}
      - TALOSCONFIG=../.talosconfig talosctl kubeconfig - -m=false > ~/.kube/{{.cluster}}.yaml
      - KUBECONFIG=~/.kube/{{.cluster}}.yaml kubectl config rename-context admin@{{.cluster}} {{.cluster}}

  cilium:
    dir: .decrypted
    desc: "Install Cilium with Gateway API CRDs"
    cmds:
      - kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.3.0/standard-install.yaml
      - gomplate -d inventory=inventory.yaml -f ../templates/cilium/values.yaml.tmpl | helm upgrade --install cilium cilium/cilium -n kube-system --version=1.18.0-pre.2 -f -

  bgp:
    dir: .decrypted
    desc: "Apply BGP configuration for Cilium"
    cmds:
      - gomplate -d inventory=inventory.yaml -f ../templates/cilium/bgp.yaml.tmpl | kubectl apply -f -
