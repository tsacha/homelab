# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Plain talosctl, no talhelper (archived upstream, 2026-08-26). Rendering,
# substitution and validation live in tasks/talos-render.sh.
# No gensecret task: the cluster CA is created once, by hand — talos/README.md.
version: "3"
vars:
  CLUSTER: '{{.CLUSTER | default "home"}}'
  DIR: talos/{{.CLUSTER | default "home"}}
  NODE: '{{if eq (.CLUSTER | default "home") "gw"}}gw{{else}}bl3{{end}}'
  # Runtime mode, also the Image Factory platform (metal|hcloud for validate metal|cloud).
  MODE: '{{if eq (.CLUSTER | default "home") "gw"}}cloud{{else}}metal{{end}}'
  PLATFORM: '{{if eq (.CLUSTER | default "home") "gw"}}hcloud{{else}}metal{{end}}'
  BOOT_ARTEFACT: '{{if eq (.CLUSTER | default "home") "gw"}}hcloud-amd64.raw.xz{{else}}metal-amd64.iso{{end}}'
  # talenv keys — names only, never values (talos/README.md).
  ENDPOINT_VAR: '{{if eq (.CLUSTER | default "home") "gw"}}GW_FQDN{{else}}KUBE_FQDN{{end}}'
  ADDR_VAR: '{{if eq (.CLUSTER | default "home") "gw"}}GW_ADDR6{{else}}BL3_ADDR6{{end}}'
env:
  TALOS_VERSION: v1.13.8 # renovate: datasource=github-releases depName=siderolabs/talos
  KUBERNETES_VERSION: v1.36.3 # renovate: datasource=github-releases depName=kubernetes/kubernetes
tasks:
  default:
    cmds:
      - go-task --list-all | grep 'talos:'
  config:
    desc: "Render and validate machine configs (CLUSTER=home|gw)"
    dir: "{{.DIR}}"
    cmds:
      - ../../tasks/talos-render.sh {{.NODE}} {{.MODE}} {{.ENDPOINT_VAR}} {{.ADDR_VAR}}
  schematic:
    desc: "Refresh schematic.id from schematic.yaml via the Image Factory (CLUSTER=home|gw)"
    dir: "{{.DIR}}"
    cmds:
      - curl -sf -X POST --data-binary @schematic.yaml https://factory.talos.dev/schematics | yq -r .id > schematic.id
      - cat schematic.id
  url:
    desc: "Image Factory URLs — boot artefact and installer image (CLUSTER=home|gw)"
    dir: "{{.DIR}}"
    cmds:
      - 'echo "image:     https://factory.talos.dev/image/$(cat schematic.id)/${TALOS_VERSION}/{{.BOOT_ARTEFACT}}"'
      - 'echo "installer: factory.talos.dev/{{.PLATFORM}}-installer/$(cat schematic.id):${TALOS_VERSION}"'
  cmd:
    desc: "Print the talosctl command for a step (CLUSTER=home|gw STEP=apply|bootstrap|health|kubeconfig|upgrade|upgrade-k8s)"
    dir: "{{.DIR}}"
    cmds:
      - |
        addr=$(sops -d talenv.sops.yaml | yq -r .{{.ADDR_VAR}})
        base="talosctl --talosconfig=./clusterconfig/talosconfig --nodes=$addr"
        case "{{.STEP}}" in
          apply)       echo "talosctl apply-config --talosconfig=./clusterconfig/talosconfig --nodes=$addr --file=./clusterconfig/{{.NODE}}.yaml" ;;
          bootstrap)   echo "$base bootstrap" ;;
          health)      echo "$base health" ;;
          kubeconfig)  echo "$base kubeconfig" ;;
          upgrade)     echo "$base upgrade --image=factory.talos.dev/{{.PLATFORM}}-installer/$(cat schematic.id):${TALOS_VERSION}" ;;
          upgrade-k8s) echo "$base upgrade-k8s --to=${KUBERNETES_VERSION}" ;;
          *)           echo "unknown STEP '{{.STEP}}'" >&2; exit 1 ;;
        esac
  cmd:apply-insecure:
    desc: "Print the first apply-config against a maintenance-mode node (-n is its DHCP address, not talenv's)"
    dir: "{{.DIR}}"
    cmds:
      - |
        addr=$(sops -d talenv.sops.yaml | yq -r .{{.ADDR_VAR}})
        echo "talosctl apply-config --talosconfig=./clusterconfig/talosconfig --nodes=$addr --file=./clusterconfig/{{.NODE}}.yaml --insecure"
  cmd:bootstrap:
    desc: "Print the etcd bootstrap command — run ONCE, on ONE node, ever"
    dir: "{{.DIR}}"
    cmds:
      - |
        addr=$(sops -d talenv.sops.yaml | yq -r .{{.ADDR_VAR}})
        echo "talosctl --talosconfig=./clusterconfig/talosconfig --nodes=$addr bootstrap"
  etcd:snapshot:
    desc: "Take an etcd snapshot (CLUSTER=home|gw)"
    dir: "{{.DIR}}"
    cmds:
      - |
        mkdir -p ../../.private/etcd
        out="../../.private/etcd/{{.CLUSTER}}-$(date -u +%Y%m%dT%H%M%SZ).snapshot"
        talosctl --talosconfig clusterconfig/talosconfig etcd snapshot "$out"
        echo "wrote $out"
  kubeconfig:
    desc: "Merge the cluster's kubeconfig into ~/.kube/clusters/<CLUSTER_NAME>.yaml"
    dir: "{{.DIR}}"
    cmds:
      - |
        mkdir -p ~/.kube/clusters
        name=$(sops -d talenv.sops.yaml | yq -r .CLUSTER_NAME)
        talosctl --talosconfig clusterconfig/talosconfig kubeconfig \
          --force ~/.kube/clusters/"$name".yaml
