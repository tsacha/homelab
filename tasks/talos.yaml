# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"
vars:
  CLUSTER:
    sh: |
      ctx=$(kubectl config current-context 2>/dev/null | sed 's/.*@//') || true
      case "$ctx" in
        "$(yq -r '.gw.fqdn|sub("\\.";"-")' .private/inventory.yaml)") echo gw ;;
        "$(yq -r '.network.fqdn|sub("\\.";"-")' .private/inventory.yaml)") echo home ;;
        *)
          echo "talos: kubectl context '$ctx' is neither cluster — pass CLUSTER=home|gw" >&2
          exit 1
          ;;
      esac
  DIR: talos/{{.CLUSTER}}
  NODE: '{{if eq .CLUSTER "gw"}}gw{{else}}bl3{{end}}'
  MODE: '{{if eq .CLUSTER "gw"}}cloud{{else}}metal{{end}}'
  ENDPOINT_VAR: '{{if eq .CLUSTER "gw"}}GW_FQDN{{else}}KUBE_FQDN{{end}}'
  ADDR_VAR: '{{if eq .CLUSTER "gw"}}GW_ADDR6{{else}}BL3_ADDR6{{end}}'
env:
  TALOS_VERSION: v1.14.0-rc.2 # renovate: datasource=github-releases depName=siderolabs/talos
  KUBERNETES_VERSION: v1.36.3 # renovate: datasource=github-releases depName=kubernetes/kubernetes
tasks:
  default:
    cmds:
      - go-task --list-all | grep 'talos:'
  cluster:
    internal: true
    preconditions:
      - sh: test "{{.CLUSTER}}" = home || test "{{.CLUSTER}}" = gw
        msg: "talos: CLUSTER must be home or gw"
  ctl:
    desc: "Run any talosctl command (go-task talos:ctl CLUSTER=home -- dashboard)"
    deps: [cluster]
    cmds:
      - |
        case "{{.CLUSTER}}" in
          gw) addr_var=GW_ADDR6 ;;
          home) addr_var=BL3_ADDR6 ;;
        esac
        talenv=$(sops -d "{{.DIR}}/talenv.sops.yaml")
        addr=$(printf '%s\n' "$talenv" | yq -r ".$addr_var")
        set -- {{.CLI_ARGS}}
        exec talosctl --talosconfig "{{.DIR}}/clusterconfig/talosconfig" --nodes "$addr" --endpoints "$addr" "$@"
  config:
    desc: "Render and validate machine configs (CLUSTER=home|gw)"
    deps: [cluster]
    dir: "{{.DIR}}"
    cmds:
      - |
        sops exec-env talenv.sops.yaml bash -euo pipefail -c '
          vars=$(grep -ohE "\$\{[A-Z0-9_]+\}" patches/*.yaml | sort -u)
          for name in $(tr -d "${}" <<<"$vars"); do [[ -v $name ]] || exit 1; done

          mkdir -p clusterconfig
          {
            for patch in patches/*.yaml; do
              printf "%s\\n" "---"
              cat "$patch"
            done
          } | envsubst "$vars" > clusterconfig/patches.yaml

          talosctl gen config "$CLUSTER_NAME" "https://${!1}:6443" \
            --with-secrets <(sops -d talsecret.sops.yaml) \
            --talos-version "$TALOS_VERSION" \
            --kubernetes-version "$KUBERNETES_VERSION" \
            --with-docs=false --with-examples=false \
            --config-patch @clusterconfig/patches.yaml \
            --output-types controlplane,talosconfig \
            --output clusterconfig --force
          mv clusterconfig/controlplane.yaml "clusterconfig/$2.yaml"
          talosctl validate --config "clusterconfig/$2.yaml" --mode "$3" --strict
          addr=${!4}
          talosctl --talosconfig clusterconfig/talosconfig config endpoint "$addr"
          talosctl --talosconfig clusterconfig/talosconfig config node "$addr"
          echo "rendered clusterconfig/$2.yaml"
        ' _ "{{.ENDPOINT_VAR}}" "{{.NODE}}" "{{.MODE}}" "{{.ADDR_VAR}}"
  apply:
    desc: "Render then apply the machine config (CLUSTER=home|gw)"
    deps: [config]
    cmds:
      - task: ctl
        vars:
          CLI_ARGS: apply-config --file {{.DIR}}/clusterconfig/{{.NODE}}.yaml
