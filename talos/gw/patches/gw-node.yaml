machine:
  install:
    disk: ${GW_INSTALL_DISK}
    image: factory.talos.dev/hcloud-installer/${SCHEMATIC_ID}:${TALOS_VERSION}
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: 'off'
hostname: gw
---
# The one physical NIC, whatever its name.
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: link.type == 1
---
# Hetzner DHCP is v4-only; v6 is static.
apiVersion: v1alpha1
kind: DHCPv4Config
name: ethSel0
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel0
addresses:
  - address: ${GW_ADDR6}/64
routes:
  - gateway: fe80::1
---
apiVersion: v1alpha1
kind: WireguardConfig
name: wg0
privateKey: ${WG_PRIVATEKEY}
listenPort: ${WG_LISTEN_PORT}
peers:
  # No endpoint: home-router holds the dynamic address and initiates.
  - publicKey: ${WG_PEER_PUBLICKEY}
    allowedIPs: ${WG_ALLOWED}
mtu: ${WG_MTU}
addresses:
  - address: ${WG_ADDR6}
  - address: ${WG_ADDR4}
