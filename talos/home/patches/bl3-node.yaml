apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/${SCHEMATIC_ID}:${TALOS_VERSION}
provisioning:
  diskSelector:
    # dev_path is the kernel path; a by-id path only appears in symlinks.
    match: disk.dev_path == "${BL3_INSTALL_DISK}" || "${BL3_INSTALL_DISK}" in disk.symlinks
  wipe: false
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: 'off'
hostname: bl3
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: ${DNS6}
  - address: ${GW4}
searchDomains:
  disableDefault: false
---
apiVersion: v1alpha1
kind: LinkConfig
name: ${BL3_IFACE}
addresses:
  - address: ${BL3_ADDR6}/64
  - address: ${BL3_ADDR4}/24
routes:
  - gateway: ${GW6}
  - gateway: ${GW4}
