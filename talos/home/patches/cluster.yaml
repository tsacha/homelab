machine:
  certSANs:
    - ${KUBE_FQDN}
    - ${BL3_FQDN}
---
# Recreate KubeNodeConfig without the control-plane taint.
apiVersion: v1alpha1
kind: KubeNodeConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  node-role.kubernetes.io/control-plane: ""
  node.kubernetes.io/exclude-from-external-load-balancers: ""
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeNetworkConfig
podSubnets:
  - ${POD_CIDR6}
  - ${POD_CIDR4}
serviceSubnets:
  - ${SVC_CIDR6}
  - ${SVC_CIDR4}
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
certExtraSANs:
  - ${KUBE_FQDN}
  - ${BL3_FQDN}
